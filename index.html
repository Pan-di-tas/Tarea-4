<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea 4_Maquetacion de un formulario</title>
  <meta name="description" content="Maquetacion de un formulario con validacion">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>
<body>
  <hr class="cintaA ancho">
  <div class="ancho cont_img centro">
    <img src="img/logo_cabecera.png" alt="logo_cabecera">
  </div>
  <div class="ancho centro cont_dej margen">
    <br>
    <h2>DÉJANOS CONOCERTE</h2>
    <br>
    <hr class="cintaR">
  </div>
  <br>
  <div class="cont_info ancho margen">
    <h2 class="centro">¡ Compártenos tu información !</h2>
    <br>
    <h3 class="centro">Dejanos tus datos personales y nosotros nos comunicaremos contigo lo mas pronto posible</h3>
    <br><br>
    <form action="" id="" name="validacionformulario" method="get">
      <input class="left" type="text" id="nombrecompleto" placeholder="Nombre Completo *">
      <input class="right" type="text" placeholder="Estado">
      <input class="left" type="email" placeholder="Correo Electronico *" id="email">
      <input class="right" type="text" placeholder="Colonia">
      <input class="left" type="number" placeholder="Celular *" id="numero">
      <select class="right" name="" id="Area">
        <option value="">Elige tu área de interes *</option>
        <option value="Cajas">Cajas</option>
        <option value="Servicios">Servicios</option>
        <option value="Asesoramiento Financiero">Asesoramiento Financiero</option>
        <option value="Gestoría y Cobranza">Gestoría y Cobranza</option>
        <option value="Crédito">Crédito</option>
        <option value="Jurídico">Jurídico</option>
        <option value="Archivo">Archivo</option>
        <option value="Mercadotecnia">Mercadotecnia</option>
        <option value="Diligencias">Diligencias</option>
        <option value="Compras">Compras</option>
        <option value="Intendencia">Intendencia</option>
        <option value="Auditoría">Auditoría</option>
        <option value="Capital Humano">Capital Humano</option>
        <option value="Mantenimiento">Mantenimiento</option>
        <option value="Sistemas">Sistemas</option>
        <option value="Contabilidad">Contabilidad</option>
        <option value="Administración">Administración</option>
      </select>
      <input class="left" type="text" placeholder="Ciudad">
      <div class="radio">
        <input type="radio" name="Situacion_fiscal" id="" checked><label for="">Persona Fisica</label>
        <input type="radio" name="Situacion_fiscal"><label for="">Persona Moral</label>
      </div>
      <input class="left" type="text" placeholder="Localidad">
      <br>
      <br>
      <br>
      <button class="btn_rojo" id="validar" type="button">Enviar</button>
    </form>
    <br>
    <br>
    <br>
  </div>
  <br>
  <div class="datos centro ancho negritas">
    <p>Abdiel Antonio Magaña Ayala</p>
    <p>7SB</p>
    <p>Programación Web</p>
  </div>

  <!-- validacion del formulario -->
   <script>
    $("#validar").click(function(){
      if ($("#nombrecompleto").val().trim() == ""){
        alert("Pon tu nombre completo por favor");
        $("#nombrecompleto").focus();
        return 0;
      }
      if ($("#email").val().trim() == ""){
        alert("Pon tu email por favor");
        $("#email").focus();
        return 0;
      }

      let emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      if (!emailValido.test($("#email").val())){
        alert("Escribe un email valido");
        $("#email").focus();
        return 0;
      }

      let numero = $("#numero").val().trim();

      if (numero == "" || numero < 0 || numero.length != 10){
        alert("Pon tu numero de celular valido");
        $("#numero").focus();
        return 0;
      }

      if ($("#Area").val().trim() == ""){
        alert("Selecciona un area de Interes por favor");
        $("#Area").focus().first();
        return 0;
      }
      else {
        document.validacionformulario.submit();
      }
    })
   </script>
</body>
</html>
